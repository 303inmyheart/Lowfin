name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore existing app signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.LOWFIN_SIGNING_KEYSTORE }}
        run: |
          key_dir="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$key_dir"
          if [ -n "$SIGNING_KEYSTORE" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$key_dir/debug.keystore"
            chmod 600 "$key_dir/debug.keystore"
            echo 'LOWFIN_REQUIRE_EXISTING_SIGNER=true' >> "$GITHUB_ENV"
          else
            echo '::warning::Signing secret missing; this build will use a new debug certificate and cannot update the supplied APK.'
          fi
          printf 'ANDROID_USER_HOME=%s\n' "$key_dir" >> "$GITHUB_ENV"
      - name: Run tests, lint and optimized build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleOptimized
      - name: Verify and package APK
        id: package
        run: python3 tools/ci_artifacts.py
      - name: Upload APK, checksum and build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lowfin-${{ steps.package.outputs.version }}-build-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Android-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/qa/
          if-no-files-found: ignore
          retention-days: 14
