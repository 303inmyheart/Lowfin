plugins { id 'com.android.application' }
def publicRelease = providers.gradleProperty('lowfinPublicRelease').getOrElse('false')
if (!(publicRelease in ['true', 'false'])) throw new GradleException('lowfinPublicRelease must be true or false')
android {
    namespace 'de.lowfin.tv'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig { applicationId 'de.lowfin.tv'; minSdk 26; targetSdk 35; versionCode 112; versionName '1.5.2'; testInstrumentationRunner 'de.lowfin.tv.ChannelDiagnostics' }
    defaultConfig { buildConfigField 'boolean', 'DIAGNOSTICS_DEFAULT', publicRelease == 'true' ? 'false' : 'true' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release { signingConfig signingConfigs.debug; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
        optimized { initWith release; signingConfig signingConfigs.debug; matchingFallbacks = ['release'] }
    }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true; unitTests.all { maxHeapSize = "1536m"; forkEvery = 20; maxParallelForks = 1 } }
}
dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.tvprovider:tvprovider:1.1.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-effect:1.8.0'
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.8.0+1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
